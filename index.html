<script>
(()=>{'use strict';const first=document.querySelector('#first'),last=document.querySelector('#last'),hold=document.querySelector('#hold'),fill=document.querySelector('#fill'),percent=document.querySelector('#percent'),track=document.querySelector('.track'),effects=document.querySelector('#effects'),card=document.querySelector('main');let start=null,frame=0,done=false,pointer=null,key=null,lastParticle=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function progress(n){fill.style.width=n+'%';percent.textContent=n+'%';track.setAttribute('aria-valuenow',n)}
function particle(burst=false){if(reduced)return;const e=document.createElement('span');e.className='particle';e.textContent=['♡','♥','✦','✨'][Math.floor(Math.random()*4)];e.style.left=(8+Math.random()*80)+'%';e.style.top=(burst?35+Math.random()*60:65+Math.random()*22)+'%';e.style.color=['#e78cb1','#bea2de','#eac078'][Math.floor(Math.random()*3)];effects.append(e);e.addEventListener('animationend',()=>e.remove(),{once:true})}
function cancel(){cancelAnimationFrame(frame);start=null;pointer=null;key=null;card.classList.remove('holding');if(!done)progress(0)}
function tick(now){if(start===null||done)return;const n=Math.min(100,Math.floor((now-start)/2200*100));progress(n);if(now-lastParticle>160){particle();lastParticle=now}if(n===100){done=true;cancel();first.hidden=true;last.hidden=false;document.querySelector('#message').focus({preventScroll:true});document.querySelector('#status').textContent='내놔 선물';for(let i=0;i<16;i++)particle(true);return}frame=requestAnimationFrame(tick)}
function begin(){if(done||start!==null)return;start=performance.now();lastParticle=0;card.classList.add('holding');frame=requestAnimationFrame(tick)}
hold.addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button!==0||start!==null)return;e.preventDefault();pointer=e.pointerId;hold.setPointerCapture(e.pointerId);begin()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])hold.addEventListener(event,e=>{if(e.pointerId===pointer)cancel()});
hold.addEventListener('contextmenu',e=>e.preventDefault());hold.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();if(start===null){key=e.code;begin()}}});hold.addEventListener('keyup',e=>{if(e.code===key){e.preventDefault();cancel()}});hold.addEventListener('blur',()=>{if(key)cancel()});window.addEventListener('blur',cancel);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel()});document.querySelector('#replay').addEventListener('click',()=>{done=false;cancel();effects.replaceChildren();last.hidden=true;first.hidden=false;document.querySelector('#status').textContent='처음 화면';hold.focus({preventScroll:true})});})();
</script></body></html>
